<table aria-label="Record details" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;table-layout:fixed;margin:16px 0 20px;">
  <tbody>
    {% for detail in email_details %}<tr>
      <th scope="row" align="left" valign="top" style="width:36%;text-align:left;vertical-align:top;padding:8px 12px 8px 0;border-bottom:1px solid #d9d9d9;font-size:14px;line-height:20px;word-break:break-word;overflow-wrap:anywhere;">{{ detail.label }}</th>
      <td valign="top" style="vertical-align:top;padding:8px 0;border-bottom:1px solid #d9d9d9;font-size:15px;line-height:22px;word-break:break-word;overflow-wrap:anywhere;">{{ detail.value }}</td>
    </tr>{% endfor %}
  </tbody>
</table>
