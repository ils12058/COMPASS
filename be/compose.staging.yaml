name: compass

x-app: &app
  image: ${COMPASS_IMAGE:?COMPASS_IMAGE must be set}
  env_file:
    - .env
  environment:
    RUNTIME_SECRETS_MODE: files
  group_add:
    - "1900"
  volumes:
    - type: bind
      source: /run/compass-secrets
      target: /run/secrets/compass
      read_only: true
      bind:
        create_host_path: false
  restart: unless-stopped

services:
  web:
    <<: *app
    pull_policy: always
    command:
      [
        "gunicorn",
        "--bind",
        "0.0.0.0:8000",
        "--workers",
        "${WEB_CONCURRENCY:-2}",
        "--no-control-socket",
        "--access-logfile",
        "-",
        "--error-logfile",
        "-",
        "config.wsgi:application",
      ]
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/api/v1/health/ready', headers={'Host': os.environ.get('CADDY_HEALTH_HOST', 'localhost'), 'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *app
    pull_policy: always
    command:
      [
        "celery",
        "--app",
        "config",
        "worker",
        "--loglevel=INFO",
        "--concurrency=${CELERY_WORKER_CONCURRENCY:-2}",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    <<: *app
    pull_policy: always
    command: ["celery", "--app", "config", "beat", "--loglevel=INFO", "--pidfile="]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  proxy:
    image: docker.io/library/caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      CADDY_ADDRESS: "${CADDY_ADDRESS:?CADDY_ADDRESS must be set}"
      CADDY_HEALTH_HOST: "${CADDY_HEALTH_HOST:?CADDY_HEALTH_HOST must be set}"
      CADDY_MAX_REQUEST_BODY_SIZE: "${CADDY_MAX_REQUEST_BODY_SIZE:-10MB}"
    ports:
      - "${PROXY_BIND_ADDRESS:-0.0.0.0}:${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_BIND_ADDRESS:-0.0.0.0}:${PROXY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--header=Host: ${CADDY_HEALTH_HOST}",
          "--header=X-Forwarded-Proto: https",
          "--spider",
          "--quiet",
          "http://web:8000/api/v1/health/ready",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      web:
        condition: service_healthy

  postgres:
    image: docker.io/library/postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-compass}"
      POSTGRES_USER: "${POSTGRES_USER:-compass}"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - type: bind
        source: /run/compass-secrets/postgres_password
        target: /run/secrets/postgres_password
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/library/redis:8.10.1-trixie
    restart: unless-stopped
    entrypoint: ["sh", "/usr/local/bin/compass-redis-start"]
    tmpfs:
      - /run/compass-redis:rw,noexec,nosuid,nodev,size=1m,mode=0700
    volumes:
      - redis_data:/data
      - ./redis-start.sh:/usr/local/bin/compass-redis-start:ro
      - type: bind
        source: /run/compass-secrets/redis_password
        target: /run/secrets/redis_password
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli --no-auth-warning ping 2>/dev/null | grep -qx PONG",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
