name: Publications foundation focused validation
# Exact-head validation trigger after OpenAPI sync.

on:
  push:
    branches:
      - feature/announcements-resources-foundation
    paths:
      - "be/**"
      - "contracts/**"
      - ".github/workflows/publications-foundation-ci.yml"

permissions:
  contents: write

jobs:
  focused-publications:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: compass_test
          POSTGRES_USER: compass
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compass -d compass_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install locked dependencies
        working-directory: be
        run: uv sync --frozen
      - name: Lightweight static and migration gates
        working-directory: be
        run: |
          uv lock --check
          uv run ruff format --check .
          uv run ruff check .
          uv run python -m compileall -q compass tests/test_announcements.py tests/test_resources.py
          uv run python manage.py makemigrations --check --dry-run --settings=tests.settings
          uv run python manage.py migrate --noinput --settings=tests.settings
          uv run python manage.py check --settings=tests.settings
      - name: Generate OpenAPI contract
        working-directory: be
        run: uv run python manage.py export_openapi --settings=tests.settings
      - name: Sync generated OpenAPI on feature branch
        id: openapi_sync
        run: |
          if git diff --quiet -- contracts/openapi.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/openapi.json
          git commit -m "chore: sync OpenAPI contract"
          git push origin HEAD:feature/announcements-resources-foundation
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Focused publication tests
        if: steps.openapi_sync.outputs.changed != 'true'
        working-directory: be
        run: >-
          uv run pytest
          tests/test_announcements.py
          tests/test_resources.py
          tests/test_accounts.py
          tests/test_storage.py
          tests/test_openapi_contract.py
      - name: Contract check
        if: steps.openapi_sync.outputs.changed != 'true'
        working-directory: be
        run: uv run python manage.py export_openapi --check --settings=tests.settings
      - name: Diff whitespace check
        if: steps.openapi_sync.outputs.changed != 'true'
        run: git diff --check
