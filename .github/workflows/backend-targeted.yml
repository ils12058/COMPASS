name: Backend targeted validation

on:
  pull_request:
    branches: [staging]
    paths:
      - "be/**"
      - "contracts/**"
      - ".github/workflows/backend-targeted.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  targeted-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: compass_test
          POSTGRES_USER: compass
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compass -d compass_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install locked dependencies
        working-directory: be
        run: uv sync --frozen
      - name: Bootstrap Routine Interview fixes
        if: github.event_name == 'pull_request'
        working-directory: be
        run: |
          python - <<'PY'
          from pathlib import Path

          services = Path("compass/routine_interviews/services.py")
          text = services.read_text()
          text = text.replace(
              'target_type="routine_interviews.routineinterview"',
              'target_type="routine.interview"',
          )
          services.write_text(text)

          accounts = Path("tests/test_accounts.py")
          text = accounts.read_text()
          text = text.replace("RoleCapability.objects.count() == 29", "RoleCapability.objects.count() == 33")
          text = text.replace("Capability.objects.count() == 20", "Capability.objects.count() == 24")
          text = text.replace(
              '        "counseling.manage_assigned",\n    }',
              '        "counseling.manage_assigned",\n'
              '        "routine_interviews.view_assigned",\n'
              '        "routine_interviews.manage_assigned",\n'
              '    }',
              1,
          )
          text = text.replace(
              '    assert user.has_capability("counseling.manage_assigned")\n'
              '    assert not user.has_capability("accounts.manage")',
              '    assert user.has_capability("counseling.manage_assigned")\n'
              '    assert user.has_capability("routine_interviews.view_assigned")\n'
              '    assert user.has_capability("routine_interviews.manage_assigned")\n'
              '    assert not user.has_capability("accounts.manage")',
              1,
          )
          accounts.write_text(text)

          contract = Path("tests/test_openapi_contract.py")
          text = contract.read_text()
          text = text.replace(
              '    "inventoryGetMyHistoryItem",\n}',
              '    "inventoryGetMyHistoryItem",\n'
              '    "routineInterviewsEnsureMyForAppointment",\n'
              '    "routineInterviewsCreateDirect",\n'
              '    "routineInterviewsListMine",\n'
              '    "routineInterviewsGetMine",\n'
              '    "routineInterviewsReplaceMyIntake",\n'
              '    "routineInterviewsSubmitMyIntake",\n'
              '    "routineInterviewsGetAssigned",\n'
              '    "routineInterviewsReplaceAssignedEvaluation",\n'
              '    "routineInterviewsFinalizeAssignedEvaluation",\n'
              '}',
              1,
          )
          text = text.replace(
              '        "inventory",\n    ]',
              '        "inventory",\n'
              '        "routine-interviews",\n'
              '    ]',
              1,
          )
          text = text.replace(
              '            "organization.view",\n'
              '            "services.manage",',
              '            "organization.view",\n'
              '            "routine_interviews.manage_assigned",\n'
              '            "routine_interviews.manage_self",\n'
              '            "routine_interviews.view_assigned",\n'
              '            "routine_interviews.view_self",\n'
              '            "services.manage",',
              1,
          )
          contract.write_text(text)
          PY
          uv run ruff check --fix --unsafe-fixes . || true
          uv run ruff format .
          uv run python manage.py export_openapi --settings=tests.settings
          if ! git diff --quiet -- . ../contracts/openapi.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add . ../contracts/openapi.json
            git commit -m "Fix Routine Interview validation regressions"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Static and migration checks
        working-directory: be
        run: |
          uv lock --check
          uv run ruff format --check .
          uv run ruff check .
          uv run python -m compileall -q compass tests
          uv run python manage.py makemigrations --check --dry-run --settings=tests.settings
          uv run python manage.py migrate --noinput --settings=tests.settings
          uv run python manage.py check --settings=tests.settings
      - name: Generate OpenAPI contract
        working-directory: be
        run: uv run python manage.py export_openapi --settings=tests.settings
      - name: Upload generated OpenAPI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-contract
          path: contracts/openapi.json
      - name: Contract must be committed
        run: git diff --exit-code -- contracts/openapi.json
      - name: Targeted tests
        working-directory: be
        run: >-
          uv run pytest
          tests/test_routine_interviews.py
          tests/test_institutional_forms.py
          tests/test_inventory.py
          tests/test_counseling.py
          tests/test_appointments.py
          tests/test_accounts.py
          tests/test_account_management.py
          tests/test_organization.py
          tests/test_service_catalog.py
          tests/test_availability.py
          tests/test_idempotency.py
          tests/test_openapi_contract.py
      - name: Contract check
        working-directory: be
        run: uv run python manage.py export_openapi --check --settings=tests.settings
      - name: Diff whitespace check
        run: git diff --check
