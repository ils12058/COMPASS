name: Backend targeted validation

on:
  pull_request:
    branches: [staging]
    paths:
      - "be/**"
      - "contracts/**"
      - ".github/workflows/backend-targeted.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  targeted-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: compass_test
          POSTGRES_USER: compass
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compass -d compass_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install locked dependencies
        working-directory: be
        run: uv sync --frozen
      - name: Normalize branch artifacts
        if: github.event_name == 'pull_request'
        working-directory: be
        run: |
          python - <<'PY'
          from pathlib import Path

          policy = Path("compass/accounts/policy.py")
          text = policy.read_text()
          text = text.replace(
              '        description="Create, edit, and submit the authenticated Student\'s Routine Interview Intake.",',
              '        description=(\n'
              '            "Create, edit, and submit the authenticated Student\'s "\n'
              '            "Routine Interview Intake."\n'
              '        ),',
          )
          policy.write_text(text)

          services = Path("compass/routine_interviews/services.py")
          text = services.read_text()
          text = text.replace(
              '                    "The Idempotency-Key was already used for a different Routine Interview request."',
              '                    "The Idempotency-Key was already used for a different "\n'
              '                    "Routine Interview request."',
          )
          text = text.replace(
              '            if concurrent.direct_request_fingerprint != request_fingerprint:\n'
              '                raise RoutineInterviewCreationConflict(\n'
              '                    "The Idempotency-Key was already used for a different "\n'
              '                    "Routine Interview request."\n'
              '                )\n'
              '            return _queryset().get(pk=concurrent.pk)',
              '            if concurrent.direct_request_fingerprint != request_fingerprint:\n'
              '                raise RoutineInterviewCreationConflict(\n'
              '                    "The Idempotency-Key was already used for a different "\n'
              '                    "Routine Interview request."\n'
              '                ) from None\n'
              '            return _queryset().get(pk=concurrent.pk)',
          )
          services.write_text(text)
          PY
          uv run ruff check --fix --unsafe-fixes . || true
          uv run ruff format .
          uv run python manage.py export_openapi --settings=tests.settings
          if ! git diff --quiet -- . ../contracts/openapi.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add . ../contracts/openapi.json
            git commit -m "Normalize Routine Interview branch"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Static and migration checks
        working-directory: be
        run: |
          uv lock --check
          uv run ruff format --check .
          uv run ruff check .
          uv run python -m compileall -q compass tests
          uv run python manage.py makemigrations --check --dry-run --settings=tests.settings
          uv run python manage.py migrate --noinput --settings=tests.settings
          uv run python manage.py check --settings=tests.settings
      - name: Generate OpenAPI contract
        working-directory: be
        run: uv run python manage.py export_openapi --settings=tests.settings
      - name: Upload generated OpenAPI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-contract
          path: contracts/openapi.json
      - name: Contract must be committed
        run: git diff --exit-code -- contracts/openapi.json
      - name: Targeted tests
        working-directory: be
        run: >-
          uv run pytest
          tests/test_routine_interviews.py
          tests/test_institutional_forms.py
          tests/test_inventory.py
          tests/test_counseling.py
          tests/test_appointments.py
          tests/test_accounts.py
          tests/test_account_management.py
          tests/test_organization.py
          tests/test_service_catalog.py
          tests/test_availability.py
          tests/test_idempotency.py
          tests/test_openapi_contract.py
      - name: Contract check
        working-directory: be
        run: uv run python manage.py export_openapi --check --settings=tests.settings
      - name: Diff whitespace check
        run: git diff --check
