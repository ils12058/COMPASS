name: Backend targeted validation

on:
  pull_request:
    branches: [staging]
    paths:
      - "be/**"
      - "contracts/**"
      - ".github/workflows/backend-targeted.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-backend:
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: compass_test
          POSTGRES_USER: compass
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compass -d compass_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install locked dependencies
        working-directory: be
        run: uv sync --frozen
      - name: Install Chromium for document rendering
        working-directory: be
        run: uv run playwright install --with-deps --only-shell chromium
      - name: Static and migration checks
        working-directory: be
        run: |
          uv lock --check
          uv run ruff format --check .
          uv run ruff check .
          uv run python -m compileall -q compass tests
          uv run python manage.py makemigrations --check --dry-run --settings=tests.settings
          uv run python manage.py migrate --noinput --settings=tests.settings
          uv run python manage.py check --settings=tests.settings
      - name: Generate OpenAPI contract
        working-directory: be
        run: uv run python manage.py export_openapi --settings=tests.settings
      - name: Upload generated OpenAPI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-contract
          path: contracts/openapi.json
      - name: Sync generated OpenAPI contract
        id: openapi_sync
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- contracts/openapi.json; then
            echo "auto_committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] || [ "$PR_HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "auto_committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$PR_HEAD_REF" HEAD
          git add contracts/openapi.json
          git commit -m "chore: sync OpenAPI contract"
          git push origin "HEAD:$PR_HEAD_REF"
          echo "auto_committed=true" >> "$GITHUB_OUTPUT"
          echo "synced_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Dispatch exact-head validation after contract sync
        if: steps.openapi_sync.outputs.auto_committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: gh workflow run backend-targeted.yml --ref "$PR_HEAD_REF"
      - name: Contract must be committed
        if: steps.openapi_sync.outputs.auto_committed != 'true'
        run: git diff --exit-code -- contracts/openapi.json
      # Daily provider traffic is fully mocked; targeted CI must never contact Daily.co.
      - name: Backend tests
        if: steps.openapi_sync.outputs.auto_committed != 'true'
        working-directory: be
        run: uv run pytest tests
      - name: Contract check
        if: steps.openapi_sync.outputs.auto_committed != 'true'
        working-directory: be
        run: uv run python manage.py export_openapi --check --settings=tests.settings
      - name: Diff whitespace check
        if: steps.openapi_sync.outputs.auto_committed != 'true'
        run: git diff --check
