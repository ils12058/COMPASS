name: Backend targeted validation

on:
  pull_request:
    branches: [staging]
    paths:
      - "be/**"
      - "contracts/**"
      - ".github/workflows/backend-targeted.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  targeted-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: compass_test
          POSTGRES_USER: compass
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compass -d compass_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install locked dependencies
        working-directory: be
        run: uv sync --frozen
      - name: Static and migration checks
        working-directory: be
        run: |
          uv lock --check
          uv run ruff format --check .
          uv run ruff check .
          uv run python -m compileall -q compass tests
          uv run python manage.py makemigrations --check --dry-run --settings=tests.settings
          uv run python manage.py migrate --noinput --settings=tests.settings
          uv run python manage.py check --settings=tests.settings
      - name: Generate OpenAPI contract
        working-directory: be
        run: uv run python manage.py export_openapi --settings=tests.settings
      - name: Upload generated OpenAPI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-contract
          path: contracts/openapi.json
      - name: Commit generated OpenAPI
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- contracts/openapi.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/openapi.json
          git commit -m "Update generated OpenAPI contract"
          git push origin HEAD:${{ github.head_ref }}
      - name: Contract must be committed
        run: git diff --exit-code -- contracts/openapi.json
      # Daily provider traffic is fully mocked; targeted CI must never contact Daily.co.
      - name: Targeted tests
        working-directory: be
        run: >-
          uv run pytest
          tests/test_ecounseling.py
          tests/test_ecounseling_media.py
          tests/test_daily_integration.py
          tests/test_routine_interviews.py
          tests/test_institutional_forms.py
          tests/test_referrals.py
          tests/test_call_slips.py
          tests/test_inventory.py
          tests/test_counseling.py
          tests/test_shared_summaries.py
          tests/test_appointments.py
          tests/test_accounts.py
          tests/test_account_management.py
          tests/test_organization.py
          tests/test_service_catalog.py
          tests/test_availability.py
          tests/test_idempotency.py
          tests/test_openapi_contract.py
      - name: Contract check
        working-directory: be
        run: uv run python manage.py export_openapi --check --settings=tests.settings
      - name: Diff whitespace check
        run: git diff --check
