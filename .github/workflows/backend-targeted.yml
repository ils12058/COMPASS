name: Temporary final backend audit corrections CI

on:
  push:
    branches:
      - temp/ci-final-backend-audit-corrections
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-backend-audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: compass_test
          POSTGRES_USER: compass
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compass -d compass_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install locked dependencies
        working-directory: be
        run: uv sync --frozen
      - name: Lightweight static and migration gates
        working-directory: be
        run: |
          uv lock --check
          uv run ruff format --check .
          uv run ruff check .
          uv run python -m compileall -q compass tests
          uv run python manage.py makemigrations --check --dry-run --settings=tests.settings
          uv run python manage.py migrate --noinput --settings=tests.settings
          uv run python manage.py check --settings=tests.settings
      - name: Focused correction regressions
        working-directory: be
        run: |
          uv run pytest             tests/test_authentication.py             tests/test_password_change.py             tests/test_password_access.py             tests/test_ecounseling_media.py             tests/test_exit_interviews.py             tests/test_routine_interviews.py             tests/test_inventory.py             tests/test_email_change.py             tests/test_account_management.py             tests/test_service_catalog.py             tests/test_appointments.py             tests/test_graduate_tracer_reports.py             tests/test_student_profiling_report_aggregates.py             tests/test_student_profiling_report_coverage.py             tests/test_health.py             tests/test_celery.py
      - name: Generate OpenAPI contract artifact
        working-directory: be
        run: uv run python manage.py export_openapi --settings=tests.settings
      - name: Upload generated OpenAPI
        uses: actions/upload-artifact@v4
        with:
          name: final-backend-audit-openapi
          path: contracts/openapi.json
      - name: Diff whitespace check
        run: git diff --check
