name: Content management focused validation

on:
  push:
    branches:
      - feature/announcements-resources-management
    paths:
      - ".github/workflows/content-management-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-content:
    runs-on: ubuntu-latest
    env:
      COMPASS_API_BASE_URL: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22.18.0"
          cache: pnpm
          cache-dependency-path: fe/pnpm-lock.yaml

      - name: Install locked dependencies
        working-directory: fe
        run: pnpm install --frozen-lockfile

      - name: Generate API client
        working-directory: fe
        run: pnpm api:generate

      - name: Verify content management client
        working-directory: fe
        run: |
          grep -q "useAnnouncementsListManaged" src/lib/api/generated/announcements/announcements.ts
          grep -q "useResourcesAttachDraftFile" src/lib/api/generated/resources/resources.ts

      - name: Lint
        working-directory: fe
        run: pnpm lint

      - name: Typecheck
        working-directory: fe
        run: pnpm typecheck

      - name: Production build
        working-directory: fe
        run: pnpm build

      - name: Diff hygiene
        run: git diff --check

  backend-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install locked backend dependencies
        working-directory: be
        run: uv sync --frozen

      - name: Lightweight backend contract checks
        working-directory: be
        run: |
          uv run python manage.py check --settings=tests.settings
          uv run python manage.py makemigrations --check --dry-run --settings=tests.settings
          uv run python manage.py export_openapi --check --settings=tests.settings

# validation pass after editor lifecycle hardening
