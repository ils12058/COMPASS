name: Deploy staging backend

on:
  workflow_dispatch:
    inputs:
      expected_staging_sha:
        description: "Full 40-character SHA currently expected at origin/staging"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: compass-staging-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging-api.compass-gco.com
    permissions:
      contents: read
      # Read-only: confirms Backend full regression passed for the exact revision.
      actions: read
    env:
      DO_REGISTRY_NAME: ${{ vars.DO_REGISTRY_NAME }}
      DO_REGISTRY_REPOSITORY: ${{ vars.DO_REGISTRY_REPOSITORY }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      STAGING_DEPLOY_HOST: ${{ vars.STAGING_DEPLOY_HOST }}
      STAGING_DEPLOY_USER: ${{ vars.STAGING_DEPLOY_USER }}
      STAGING_DEPLOY_PORT: ${{ vars.STAGING_DEPLOY_PORT }}
      STAGING_FIREWALL_ID: ${{ vars.STAGING_FIREWALL_ID }}

    steps:
      # Dispatch from staging so both the workflow and its source are the reviewed staging revision.
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: refs/heads/staging
          fetch-depth: 0

      - name: Resolve and verify exact staging revision
        id: revision
        env:
          EXPECTED_STAGING_SHA: ${{ inputs.expected_staging_sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$EXPECTED_STAGING_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "expected_staging_sha must be a full 40-character hexadecimal SHA" >&2
            exit 1
          fi

          git fetch --no-tags origin \
            "+refs/heads/staging:refs/remotes/origin/staging"
          remote_sha="$(git rev-parse refs/remotes/origin/staging)"
          expected_sha="${EXPECTED_STAGING_SHA,,}"
          [[ "$GITHUB_REF" == "refs/heads/staging" ]] || { echo "Dispatch this workflow from staging" >&2; exit 1; }
          [[ "$GITHUB_SHA" == "$remote_sha" ]] || { echo "Workflow revision differs from current staging" >&2; exit 1; }

          if [[ "$remote_sha" != "$expected_sha" ]]; then
            echo "origin/staging moved after the requested SHA was chosen" >&2
            echo "expected: $expected_sha" >&2
            echo "actual:   $remote_sha" >&2
            exit 1
          fi

          git checkout --detach "$remote_sha"
          deploy_sha="$(git rev-parse HEAD)"
          echo "deploy_sha=$deploy_sha" >> "$GITHUB_OUTPUT"

      - name: Require canonical source lineage
        env:
          DEPLOY_SHA: ${{ steps.revision.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor d86ddc08285f16740848dc5880d9d2285e7dbce8 "$DEPLOY_SHA"
          git diff --exit-code d86ddc08285f16740848dc5880d9d2285e7dbce8 -- 'be/compass/*/migrations/0001_canonical_baseline.py'
          python3 -m unittest discover -s .github/scripts

      # Pull requests run targeted tests; the complete backend suite is the deployment gate.
      - name: Require Backend full regression for this exact revision
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.revision.outputs.deploy_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/require_full_regression.py \
            --repo "$GITHUB_REPOSITORY" --sha "$DEPLOY_SHA"

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DO_REGISTRY_NAME" =~ ^[a-z0-9-]+$ ]]
          [[ "$DO_REGISTRY_REPOSITORY" =~ ^[a-z0-9._-]+$ ]]
          [[ "$DEPLOY_PATH" == "/opt/compass" ]]
          [[ "$STAGING_DEPLOY_USER" == "compass" ]]
          [[ "$STAGING_DEPLOY_PORT" == "22" ]]
          [[ "$STAGING_FIREWALL_ID" == "3d6403c7-9acc-4faf-b6a4-fa5bb092e108" ]]
          [[ "$STAGING_DEPLOY_HOST" == "157.245.60.65" ]]
          [[ "$DO_REGISTRY_NAME" == "compass" && "$DO_REGISTRY_REPOSITORY" == "compass-backend" ]]

      - name: Resolve immutable build metadata
        id: build_metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import sys,tomllib; data=tomllib.load(open("be/pyproject.toml","rb")); value=data.get("project",{}).get("version"); sys.exit("be/pyproject.toml [project].version must be non-empty") if not isinstance(value,str) or not value.strip() else print(value.strip())')"
          build_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          test -n "$version"
          [[ "$build_time" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_time=$build_time" >> "$GITHUB_OUTPUT"

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Prepare short-lived registry push credentials
        shell: bash
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          docker_config_dir="$RUNNER_TEMP/compass-registry-push"
          install -d -m 700 "$docker_config_dir"
          doctl registry docker-config "$DO_REGISTRY_NAME" \
            --read-write \
            --expiry-seconds 900 \
            > "$docker_config_dir/config.json"
          chmod 600 "$docker_config_dir/config.json"
          echo "DOCKER_CONFIG=$docker_config_dir" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build or reuse immutable staging image
        id: image
        shell: bash
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          DEPLOY_SHA: ${{ steps.revision.outputs.deploy_sha }}
          APP_VERSION: ${{ steps.build_metadata.outputs.version }}
          BUILD_TIME: ${{ steps.build_metadata.outputs.build_time }}
        run: |
          set -euo pipefail
          image="registry.digitalocean.com/$DO_REGISTRY_NAME/$DO_REGISTRY_REPOSITORY:$DEPLOY_SHA"
          # Existing SHA tags are reused, never overwritten by a rerun with another build time.
          tags="$RUNNER_TEMP/compass-registry-tags.json"
          doctl registry repository list-tags "$DO_REGISTRY_REPOSITORY" --registry "$DO_REGISTRY_NAME" --output json > "$tags"
          existing_digest="$(python3 -c 'import json,sys; rows=[r for r in json.load(open(sys.argv[1])) if r["tag"]==sys.argv[2]]; assert len(rows)<=1; print(rows[0]["manifest_digest"] if rows else "")' "$tags" "$DEPLOY_SHA")"
          if [[ -z "$existing_digest" ]]; then
            docker buildx build \
              --platform linux/amd64 \
              --file be/Containerfile \
              --build-arg "COMPASS_BUILD_ID=$DEPLOY_SHA" \
              --build-arg "COMPASS_BUILD_TIME=$BUILD_TIME" \
              --build-arg "COMPASS_VERSION=$APP_VERSION" \
              --tag "$image" \
              --push \
              be
          fi
          digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
          test -n "$digest"

          image_config="$RUNNER_TEMP/compass-image-config.json"
          docker buildx imagetools inspect "$image" --format '{{json .Image}}' > "$image_config"
          image_revision="$(python -c 'import json,sys; print((json.load(open(sys.argv[1])).get("config",{}).get("Labels") or {}).get("org.opencontainers.image.revision",""))' "$image_config")"
          image_version="$(python -c 'import json,sys; print((json.load(open(sys.argv[1])).get("config",{}).get("Labels") or {}).get("org.opencontainers.image.version",""))' "$image_config")"
          image_created="$(python -c 'import json,sys; print((json.load(open(sys.argv[1])).get("config",{}).get("Labels") or {}).get("org.opencontainers.image.created",""))' "$image_config")"
          [[ "$image_revision" == "$DEPLOY_SHA" ]]
          [[ "$image_version" == "$APP_VERSION" ]]
          [[ "$image_created" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          [[ -z "$existing_digest" || "$existing_digest" == "$digest" ]]
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          echo "image=$image@$digest" >> "$GITHUB_OUTPUT"
          echo "build_time=$image_created" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Selected $image ($digest)"

      - name: Prepare pinned SSH trust material
        shell: bash
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/compass-staging-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$ssh_dir/id_ed25519"
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"
          echo "STAGING_SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Prepare short-lived registry pull credentials
        shell: bash
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          docker_config_dir="$RUNNER_TEMP/compass-registry-pull"
          install -d -m 700 "$docker_config_dir"
          doctl registry docker-config "$DO_REGISTRY_NAME" \
            --expiry-seconds 900 \
            > "$docker_config_dir/config.json"
          chmod 600 "$docker_config_dir/config.json"
          echo "STAGING_REGISTRY_PULL_CONFIG=$docker_config_dir/config.json" >> "$GITHUB_ENV"

      # One process owns the exact /32 rule for its whole lifetime and revokes it in finally.
      # The always() step below provides a second cleanup attempt after cancellation/failure.
      - name: Preflight and deploy onto initialized canonical staging
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          DEPLOY_SHA: ${{ steps.revision.outputs.deploy_sha }}
          IMAGE: ${{ steps.image.outputs.image }}
          APP_VERSION: ${{ steps.build_metadata.outputs.version }}
          BUILD_TIME: ${{ steps.image.outputs.build_time }}
        run: python3 .github/scripts/run_staging_deploy.py

      - name: Verify public running build identity
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.revision.outputs.deploy_sha }}
          APP_VERSION: ${{ steps.build_metadata.outputs.version }}
          BUILD_TIME: ${{ steps.image.outputs.build_time }}
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/compass-running-meta.json"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
            -H "Cache-Control: no-cache" \
            https://staging-api.compass-gco.com/api/v1/meta \
            > "$metadata"
          application="$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("application",""))' "$metadata")"
          build_id="$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("build_id",""))' "$metadata")"
          version="$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("version",""))' "$metadata")"
          environment="$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("environment",""))' "$metadata")"
          built_at="$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("built_at",""))' "$metadata")"
          [[ "$application" == "COMPASS" ]]
          [[ "$build_id" == "$DEPLOY_SHA" ]]
          [[ "$version" == "$APP_VERSION" ]]
          [[ "$environment" == "live-staging" ]]
          [[ "$built_at" == "$BUILD_TIME" ]]

      - name: Revoke owned temporary SSH access
        if: always()
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: python3 .github/scripts/run_staging_deploy.py --cleanup

      - name: Clear short-lived credentials and SSH material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/compass-registry-push" "$RUNNER_TEMP/compass-registry-pull" "$RUNNER_TEMP/compass-staging-ssh"
