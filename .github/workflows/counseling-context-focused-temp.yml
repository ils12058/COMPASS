name: Counseling context contract validation

on:
  push:
    branches:
      - feature/counseling-context-access-foundation

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: compass_test
          POSTGRES_USER: compass
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compass -d compass_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install locked dependencies
        working-directory: be
        run: uv sync --frozen

      - name: Export canonical OpenAPI contract
        working-directory: be
        run: uv run python manage.py export_openapi --settings=tests.settings

      - name: Validate OpenAPI contract tests
        working-directory: be
        run: uv run pytest -q tests/test_openapi_contract.py

      - name: Check canonical OpenAPI contract
        working-directory: be
        run: uv run python manage.py export_openapi --check --settings=tests.settings

      - name: Commit regenerated contract
        run: |
          if git diff --quiet -- contracts/openapi.json; then
            echo "OpenAPI contract already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/openapi.json
          git commit -m "chore: regenerate counseling context OpenAPI contract"
          git push

      - name: Diff whitespace check
        run: git diff --check
