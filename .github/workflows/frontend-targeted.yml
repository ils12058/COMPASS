name: Frontend targeted validation

on:
  pull_request:
    branches: [staging, canon/compass-clean-baseline]
    paths:
      - "fe/**"
      - "contracts/openapi.json"
      - ".github/workflows/frontend-targeted.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-targeted-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  targeted-frontend:
    runs-on: ubuntu-latest
    env:
      COMPASS_API_BASE_URL: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22.18.0"
          cache: pnpm
          cache-dependency-path: fe/pnpm-lock.yaml

      - name: Install locked dependencies
        working-directory: fe
        run: pnpm install --frozen-lockfile

      - name: Generate API client
        working-directory: fe
        run: pnpm api:generate

      - name: Lint
        working-directory: fe
        run: pnpm lint

      - name: Typecheck
        working-directory: fe
        run: pnpm typecheck

      - name: Production build
        working-directory: fe
        run: pnpm build

  # Component, presentation, and contract tests (node:test), which import the generated client.
  # They run on the Node release they are maintained on: on 22.18 the TSX loader's synchronous
  # module hooks cannot load Next's CommonJS entry points (node:internal/modules/esm/translators).
  # The app itself is still linted, type-checked, and built on the pinned 22.18 runtime above.
  frontend-tests:
    runs-on: ubuntu-latest
    env:
      COMPASS_API_BASE_URL: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: "26.7.0"
          cache: pnpm
          cache-dependency-path: fe/pnpm-lock.yaml

      - name: Install locked dependencies
        working-directory: fe
        run: pnpm install --frozen-lockfile

      - name: Generate API client
        working-directory: fe
        run: pnpm api:generate

      - name: Unit tests
        working-directory: fe
        run: pnpm test

  # A separate, local-only synthetic build keeps provider seams out of the normal production
  # build above and all deployment artifacts. Compile once, then share across the eight jobs.
  browser-build:
    runs-on: ubuntu-latest
    env:
      COMPASS_API_BASE_URL: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_COMPASS_UI_TEST_MODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22.18.0"
          cache: pnpm
          cache-dependency-path: fe/pnpm-lock.yaml
      - name: Install locked dependencies
        working-directory: fe
        run: pnpm install --frozen-lockfile
      - name: Generate API client
        working-directory: fe
        run: pnpm api:generate
      - name: Build local synthetic browser application
        working-directory: fe
        run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-browser-build
          path: |
            fe/.next
            !fe/.next/cache
          include-hidden-files: true
          retention-days: 1

  # Every *.browser.mjs suite runs on both engines. Discovery and exactly-once shard
  # coverage are tested by browser-registration.test.mjs; each suite has a named log group.
  # API/provider calls are synthetic and use only the local production server.
  frontend-browser-regressions:
    needs: browser-build
    name: browser ${{ matrix.browser }} ${{ matrix.shard }}/4
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPASS_API_BASE_URL: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: "1"
      # Provider seams are enabled only in the dedicated build and only on loopback hosts.
      COMPASS_UI_BASE_URL: http://localhost:3107

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: "26.7.0"
          cache: pnpm
          cache-dependency-path: fe/pnpm-lock.yaml

      - name: Install locked dependencies
        working-directory: fe
        run: pnpm install --frozen-lockfile

      - name: Generate API client
        working-directory: fe
        run: pnpm api:generate

      - name: Install Chromium and WebKit for the locked Playwright
        working-directory: fe
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Start fail-closed synthetic SSR API
        working-directory: fe
        run: |
          nohup node tests/support/ssr-api-fallback.mjs > "$RUNNER_TEMP/ssr-api.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/__health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/ssr-api.log"
          exit 1

      - name: Download synthetic browser build
        uses: actions/download-artifact@v4
        with:
          name: synthetic-browser-build
          path: fe/.next

      - name: Start production server
        working-directory: fe
        run: |
          nohup pnpm start --port 3107 > "$RUNNER_TEMP/next-start.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --max-time 5 -fsS -o /dev/null http://localhost:3107/login; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/next-start.log"
          exit 1

      - name: Browser regressions
        working-directory: fe
        env:
          COMPASS_UI_ARTIFACTS: ${{ runner.temp }}/browser-regressions
        run: pnpm test:ui:regressions --browser "${{ matrix.browser }}" --shard "${{ matrix.shard }}/4"

      - name: Upload browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/browser-regressions
            ${{ runner.temp }}/next-start.log
            ${{ runner.temp }}/ssr-api.log
          if-no-files-found: ignore
