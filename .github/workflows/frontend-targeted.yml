name: Frontend targeted validation

on:
  pull_request:
    branches: [staging, canon/compass-clean-baseline]
    paths:
      - "fe/**"
      - "contracts/openapi.json"
      - ".github/workflows/frontend-targeted.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-targeted-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  targeted-frontend:
    runs-on: ubuntu-latest
    env:
      COMPASS_API_BASE_URL: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22.18.0"
          cache: pnpm
          cache-dependency-path: fe/pnpm-lock.yaml

      - name: Install locked dependencies
        working-directory: fe
        run: pnpm install --frozen-lockfile

      - name: Generate API client
        working-directory: fe
        run: pnpm api:generate

      - name: Lint
        working-directory: fe
        run: pnpm lint

      - name: Typecheck
        working-directory: fe
        run: pnpm typecheck

      - name: Production build
        working-directory: fe
        run: pnpm build

  # Component, presentation, and contract tests (node:test), which import the generated client.
  # They run on the Node release they are maintained on: on 22.18 the TSX loader's synchronous
  # module hooks cannot load Next's CommonJS entry points (node:internal/modules/esm/translators).
  # The app itself is still linted, type-checked, and built on the pinned 22.18 runtime above.
  frontend-tests:
    runs-on: ubuntu-latest
    env:
      COMPASS_API_BASE_URL: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: "26.7.0"
          cache: pnpm
          cache-dependency-path: fe/pnpm-lock.yaml

      - name: Install locked dependencies
        working-directory: fe
        run: pnpm install --frozen-lockfile

      - name: Generate API client
        working-directory: fe
        run: pnpm api:generate

      - name: Unit tests
        working-directory: fe
        run: pnpm test

  # Every *.browser.mjs suite runs on both engines. Discovery and exactly-once shard
  # coverage are tested by browser-registration.test.mjs; each suite has a named log group.
  # API/provider calls are synthetic and use only the local development server.
  frontend-browser-regressions:
    name: browser ${{ matrix.browser }} ${{ matrix.shard }}/4
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPASS_API_BASE_URL: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: "1"
      COMPASS_UI_TEST_MODE: "1"
      # Next blocks development resources for other origins, so the browser uses localhost.
      COMPASS_UI_BASE_URL: http://localhost:3107

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22.18.0"
          cache: pnpm
          cache-dependency-path: fe/pnpm-lock.yaml

      - name: Install locked dependencies
        working-directory: fe
        run: pnpm install --frozen-lockfile

      - name: Generate API client
        working-directory: fe
        run: pnpm api:generate

      - name: Install Chromium and WebKit for the locked Playwright
        working-directory: fe
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Start fail-closed synthetic SSR API
        working-directory: fe
        run: |
          nohup node tests/support/ssr-api-fallback.mjs > "$RUNNER_TEMP/ssr-api.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/__health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/ssr-api.log"
          exit 1

      - name: Start development server
        working-directory: fe
        run: |
          # Use the supported Webpack dev compiler for stable cold next/font/google resolution.
          nohup pnpm dev --webpack --port 3107 > "$RUNNER_TEMP/next-dev.log" 2>&1 &
          for attempt in $(seq 1 90); do
            if curl -fsS -o /dev/null http://localhost:3107/login; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/next-dev.log"
          exit 1

      # The first request to a route compiles it; compile the tested routes before timing checks.
      - name: Compile tested routes
        run: |
          for route in /portal/assessment-records /portal/assessment-records/new /portal/assessment-records/types \
            /portal/assessment-records/d0000000-0000-4000-8000-000000000001 \
            /portal/assessment-records/d0000000-0000-4000-8000-000000000001/edit \
            / /portal/actions /portal/work /portal/operations /portal /portal/services/service-density-test /portal/services/service-density-test/edit \
            /portal/services /portal/inventory/current /portal/exit-interviews/exit-draft-test \
            /portal/referrals/referral-draft-test /portal/availability/me /portal/availability/office /portal/accounts /portal/inventory /portal/exit-interviews \
            /portal/account/activity /portal/account/activity\?view=security \
            /portal/resources /portal/organization/student-affiliations /portal/availability/providers \
            /portal/announcements/long /portal/referrals/long \
            /portal/messages /portal/messages/new /portal/messages/a0000000-0000-4000-8000-000000000001 \
            /portal/call-slips/slip-density-test /portal/good-moral /portal/good-moral/11111111-1111-4111-8111-111111111116 \
            /portal/messages/templates \
            /portal/appointments/b0000000-0000-4000-8000-000000000001 \
            /portal/counseling /portal/counseling/encounters/e0000000-0000-4000-8000-000000000001 \
            /portal/counseling/workspace/appointment/b0000000-0000-4000-8000-000000000001 \
            /portal/counseling/workspace/routine-interview/c0000000-0000-4000-8000-000000000001 \
            /portal/e-counseling/b0000000-0000-4000-8000-000000000001 \
            /portal/e-counseling/appointment-density-test /portal/e-counseling/11111111-1111-4111-8111-111111111111 \
            /portal/routine-interviews/routine-slice1a; do
            curl -sS -o /dev/null -w "%{http_code} $route\n" "http://localhost:3107$route"
          done

      - name: Browser regressions
        working-directory: fe
        env:
          COMPASS_UI_ARTIFACTS: ${{ runner.temp }}/browser-regressions
        run: pnpm test:ui:regressions --browser "${{ matrix.browser }}" --shard "${{ matrix.shard }}/4"

      - name: Upload browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/browser-regressions
            ${{ runner.temp }}/next-dev.log
            ${{ runner.temp }}/ssr-api.log
          if-no-files-found: ignore
