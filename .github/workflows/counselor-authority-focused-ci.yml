name: Counselor authority focused validation

on:
  push:
    branches:
      - fix/counselor-baseline-authority

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: compass_test
          POSTGRES_USER: compass
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compass -d compass_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install locked dependencies
        working-directory: be
        run: uv sync --frozen

      - name: Static and migration gates
        working-directory: be
        run: |
          uv lock --check
          uv run ruff format --check .
          uv run ruff check .
          uv run python -m compileall -q compass tests
          uv run python manage.py makemigrations --check --dry-run --settings=tests.settings
          uv run python manage.py migrate --noinput --settings=tests.settings
          uv run python manage.py check --settings=tests.settings

      - name: Targeted counselor authority tests
        working-directory: be
        run: >-
          uv run pytest
          tests/test_accounts.py
          tests/test_appointments.py::test_appointment_capability_policy_preserves_business_authority_boundaries
          tests/test_appointment_management_scope.py::test_gss_default_capability_and_scope_list_get_filters_and_cancel
          tests/test_appointment_management_scope.py::test_head_is_institution_wide_but_gss_supervised_by_head_is_not
          tests/test_appointment_management_scope.py::test_counselor_baseline_management_is_limited_to_assigned_colleges
          tests/test_institutional_forms.py::test_configuration_capabilities_keep_head_business_authority_explicit
          tests/test_institutional_forms.py::test_operational_configuration_mutations_require_head_capability_and_recent_mfa
          tests/test_institutional_forms.py::test_regular_counselor_can_read_but_not_manage_operational_configuration
          tests/test_student_profiling_reports.py
          tests/test_student_profiling_report_aggregates.py
          tests/test_student_profiling_report_coverage.py
          tests/test_student_profiling_pdf.py::test_pdf_endpoint_reuses_reports_view_without_recent_mfa
          tests/test_student_profiling_pdf.py::test_pdf_endpoint_forwards_same_report_filters
          tests/test_student_profiling_pdf.py::test_pdf_endpoint_passes_regular_counselor_college_scope
          tests/test_student_profiling_pdf.py::test_render_service_calls_canonical_builder_once_and_preserves_filter_arguments
          tests/test_student_profiling_xlsx.py::test_xlsx_endpoint_reuses_reports_view_without_recent_mfa
          tests/test_student_profiling_xlsx.py::test_xlsx_endpoint_forwards_same_report_filters
          tests/test_student_profiling_xlsx.py::test_xlsx_endpoint_passes_regular_counselor_college_scope
          tests/test_student_profiling_xlsx.py::test_render_service_calls_canonical_builder_once_and_forwards_exact_filters
          tests/test_graduate_tracer_reports.py::test_graduate_tracer_aggregate_requires_global_report_scope
          tests/test_privacy_release_audit.py
          tests/test_openapi_contract.py

      - name: Verify OpenAPI remains canonical
        working-directory: be
        run: uv run python manage.py export_openapi --check --settings=tests.settings

      - name: Verify deployment identity-policy sync ordering
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path(".github/workflows/deploy-staging.yml").read_text()
          needles = [
              'run --rm --no-deps -T web python manage.py check',
              'run --rm -T web python manage.py migrate --noinput',
              'run --rm -T web python manage.py sync_identity_policy',
              'state="$DEPLOY_PATH/.deploy.env"',
              '"${compose[@]}" up -d --remove-orphans',
              'Verify public running build identity',
          ]
          positions = [text.index(needle) for needle in needles]
          assert positions == sorted(positions)
          assert "git pull" not in text
          PY

      - name: Diff whitespace check
        run: git diff --check HEAD^
