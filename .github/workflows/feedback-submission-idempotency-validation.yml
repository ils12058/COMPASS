name: Feedback submission idempotency validation

on:
  push:
    branches:
      - feature/feedback-submission-idempotency
    paths:
      - "be/**"
      - "contracts/openapi.json"
      - ".github/workflows/feedback-submission-idempotency-validation.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: compass_test
          POSTGRES_USER: compass
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compass -d compass_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install locked dependencies
        working-directory: be
        run: uv sync --frozen
      - name: Focused static and migration checks
        working-directory: be
        run: |
          uv lock --check
          uv run ruff format --check compass/feedback/api.py tests/test_feedback.py tests/test_openapi_contract.py
          uv run ruff check compass/feedback/api.py tests/test_feedback.py tests/test_openapi_contract.py
          uv run python -m compileall -q compass/feedback/api.py tests/test_feedback.py
          uv run python manage.py makemigrations --check --dry-run --settings=tests.settings
          uv run python manage.py check --settings=tests.settings
      - name: Feedback and shared idempotency tests
        working-directory: be
        run: uv run pytest tests/test_feedback.py tests/test_idempotency.py
      - name: Generate canonical OpenAPI
        working-directory: be
        run: uv run python manage.py export_openapi --settings=tests.settings
      - name: Targeted OpenAPI checks
        working-directory: be
        run: >-
          uv run pytest
          tests/test_openapi_contract.py::test_all_public_operations_have_stable_unique_ids_and_approved_tags
          tests/test_openapi_contract.py::test_feedback_submission_idempotency_openapi_contract
      - name: Diff whitespace check
        run: git diff --check
      - name: Sync generated OpenAPI contract
        run: |
          if git diff --quiet -- contracts/openapi.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/openapi.json
          git commit -m "chore: sync OpenAPI contract"
          git push
