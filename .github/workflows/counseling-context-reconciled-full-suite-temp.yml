name: Reconciled backend full-suite validation

on:
  push:
    branches:
      - feature/counseling-context-access-foundation
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  full-suite:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: compass_test
          POSTGRES_USER: compass
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compass -d compass_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install locked dependencies
        working-directory: be
        run: uv sync --frozen

      - name: Install Chromium for document rendering
        working-directory: be
        run: uv run playwright install --with-deps --only-shell chromium

      - name: Static migration and framework checks
        working-directory: be
        run: |
          uv lock --check
          uv run ruff format --check .
          uv run ruff check .
          uv run python -m compileall -q compass tests
          uv run python manage.py makemigrations --check --dry-run --settings=tests.settings
          uv run python manage.py migrate --noinput --settings=tests.settings
          uv run python manage.py check --settings=tests.settings

      - name: Generate canonical OpenAPI contract
        working-directory: be
        run: uv run python manage.py export_openapi --settings=tests.settings

      - name: Sync generated OpenAPI contract
        id: openapi_sync
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: feature/counseling-context-access-foundation
        run: |
          if git diff --quiet -- contracts/openapi.json; then
            echo "auto_committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/openapi.json
          git commit -m "chore: sync reconciled OpenAPI contract"
          git push origin "HEAD:$BRANCH_NAME"
          echo "auto_committed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch exact-head full suite after contract sync
        if: steps.openapi_sync.outputs.auto_committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: feature/counseling-context-access-foundation
        run: gh workflow run counseling-context-reconciled-full-suite-temp.yml --ref "$BRANCH_NAME"

      - name: Full backend test suite
        if: steps.openapi_sync.outputs.auto_committed != 'true'
        working-directory: be
        run: uv run pytest

      - name: Verify canonical OpenAPI contract
        if: steps.openapi_sync.outputs.auto_committed != 'true'
        working-directory: be
        run: uv run python manage.py export_openapi --check --settings=tests.settings

      - name: Diff whitespace check
        if: steps.openapi_sync.outputs.auto_committed != 'true'
        run: git diff --check
