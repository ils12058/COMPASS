name: Availability provider discovery validation

on:
  push:
    branches:
      - feature/availability-provider-discovery
    paths:
      - "be/compass/availability/**"
      - "be/tests/test_availability.py"
      - "be/tests/test_openapi_contract.py"
      - "contracts/openapi.json"
      - ".github/workflows/availability-provider-discovery-validation.yml"

permissions:
  contents: write

jobs:
  targeted-availability:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: compass_test
          POSTGRES_USER: compass
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compass -d compass_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install locked dependencies
        working-directory: be
        run: uv sync --frozen
      - name: Migration dry-run
        working-directory: be
        run: uv run python manage.py makemigrations --check --dry-run --settings=tests.settings
      - name: Django system check
        working-directory: be
        run: uv run python manage.py check --settings=tests.settings
      - name: Targeted Availability tests
        working-directory: be
        run: uv run pytest tests/test_availability.py
      - name: Generate OpenAPI contract
        working-directory: be
        run: uv run python manage.py export_openapi --settings=tests.settings
      - name: Availability OpenAPI schema check
        working-directory: be
        run: uv run pytest tests/test_openapi_contract.py::test_availability_provider_discovery_openapi_contract
      - name: Commit generated OpenAPI contract
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- contracts/openapi.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/openapi.json
          git commit -m "chore: sync OpenAPI contract"
          git push origin "HEAD:${BRANCH_NAME}"
