name: Reliability generated cleanup

on:
  push:
    branches:
      - feature/global-reliability-accessibility
    paths:
      - ".github/workflows/reliability-generated-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/global-reliability-accessibility

      - name: Remove temporary generated inspection output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r fe/src/lib/api/generated
          git rm .github/workflows/reliability-generated-cleanup.yml
          git commit -m "chore(system): remove generated inspection artifacts"
          git push origin HEAD:feature/global-reliability-accessibility
