name: Temporary binary OpenAPI export

on:
  push:
    branches:
      - feature/binary-download-openapi-contracts

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install locked dependencies
        working-directory: be
        run: uv sync --frozen

      - name: Regenerate canonical OpenAPI contract
        working-directory: be
        run: uv run python manage.py export_openapi --settings=tests.settings

      - name: Commit generated contract
        run: |
          if git diff --quiet -- contracts/openapi.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/openapi.json
          git commit -m "chore: regenerate OpenAPI contract"
          git push origin "HEAD:${GITHUB_REF_NAME}"
