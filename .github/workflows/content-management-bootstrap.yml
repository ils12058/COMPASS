name: Content management bootstrap

on:
  push:
    branches:
      - feature/announcements-resources-management
    paths:
      - "fe/package.json"
      - ".github/workflows/content-management-bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/announcements-resources-management

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22.18.0"
          cache: pnpm
          cache-dependency-path: fe/pnpm-lock.yaml

      - name: Refresh locked frontend dependencies
        working-directory: fe
        run: pnpm install --no-frozen-lockfile

      - name: Generate API client for inspection
        working-directory: fe
        run: pnpm api:generate

      - name: Commit lockfile and temporary generated client
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fe/pnpm-lock.yaml
          git add -f fe/src/lib/api/generated
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(content): refresh editor lockfile and generated client"
          git push origin HEAD:feature/announcements-resources-management
