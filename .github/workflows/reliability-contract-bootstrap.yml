name: Reliability contract bootstrap

on:
  push:
    branches:
      - feature/global-reliability-accessibility
    paths:
      - "be/compass/platform_ops/api.py"
      - "be/compass/api/contract.py"
      - "be/tests/test_runtime_maintenance.py"
      - "be/tests/test_openapi_contract.py"
      - ".github/workflows/reliability-contract-bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/global-reliability-accessibility

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        working-directory: be
        run: uv sync --frozen

      - name: Export canonical OpenAPI contract
        working-directory: be
        run: uv run python manage.py export_openapi --settings=tests.settings

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22.18.0"

      - name: Install frontend dependencies
        working-directory: fe
        run: pnpm install --frozen-lockfile

      - name: Generate inspection client
        working-directory: fe
        run: pnpm api:generate

      - name: Commit contract and temporary generated client
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/openapi.json
          git add -f fe/src/lib/api/generated
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(system): bootstrap status contract client"
          git push origin HEAD:feature/global-reliability-accessibility
