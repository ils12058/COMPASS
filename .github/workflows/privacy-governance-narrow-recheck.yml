name: Privacy Governance narrow recheck

on:
  push:
    branches:
      - "recheck/privacy-governance-failures-1"

permissions:
  contents: read

jobs:
  narrow-privacy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: compass_test
          POSTGRES_USER: compass
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compass -d compass_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install locked dependencies
        working-directory: be
        run: uv sync --frozen
      - name: Relevant static and migration gates
        working-directory: be
        run: |
          uv lock --check
          uv run ruff format --check .
          uv run ruff check .
          uv run python -m compileall -q compass tests
          uv run python manage.py makemigrations --check --dry-run --settings=tests.settings
          uv run python manage.py migrate --noinput --settings=tests.settings
          uv run python manage.py check --settings=tests.settings
          uv run python manage.py export_openapi --check --settings=tests.settings
      - name: Exact failed nodes and direct regressions
        working-directory: be
        run: >-
          uv run pytest
          tests/test_accounts.py::test_institutional_officer_is_neutral_and_dpo_adds_only_privacy_capabilities
          tests/test_privacy_governance.py::test_processing_register_crud_retire_bounds_and_no_hard_delete
          tests/test_privacy_governance.py::test_incident_audit_failure_rolls_back_creation
          tests/test_privacy_activity.py::test_privacy_activity_data_release_presenters_are_content_free
          tests/test_privacy_activity.py::test_privacy_activity_excludes_unrelated_domains_unknown_actions_and_malformed_rows
          tests/test_privacy_release_audit.py::test_student_profiling_successful_release_records_safe_audit_event
          tests/test_student_profiling_pdf.py::test_pdf_endpoint_reuses_reports_view_without_recent_mfa
          tests/test_student_profiling_pdf.py::test_pdf_endpoint_forwards_same_report_filters
          tests/test_student_profiling_xlsx.py::test_xlsx_endpoint_reuses_reports_view_without_recent_mfa
          tests/test_student_profiling_xlsx.py::test_xlsx_endpoint_forwards_same_report_filters
      - name: Diff whitespace check
        run: git diff --check
