name: One-time OpenAPI sync

on:
  push:
    branches:
      - feature/ecounseling-daily-foundation
    paths:
      - .github/workflows/sync-openapi-once.yml

permissions:
  contents: write

jobs:
  sync-openapi:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: be
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ecounseling-daily-foundation
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Export contract
        env:
          DJANGO_SETTINGS_MODULE: tests.settings
        run: uv run python manage.py export_openapi --output ../contracts/openapi.json
      - name: Commit generated contract and remove this one-time workflow
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sync-openapi-once.yml
          git add contracts/openapi.json
          git commit -m "Regenerate OpenAPI contract for E-Counseling"
          git push origin HEAD:feature/ecounseling-daily-foundation
