name: Reliability focused validation

on:
  push:
    branches:
      - feature/global-reliability-accessibility
    paths:
      - ".github/workflows/reliability-focused-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-reliability:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: compass_test
          POSTGRES_USER: compass
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compass -d compass_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install locked dependencies
        working-directory: be
        run: uv sync --frozen

      - name: Migrate test database
        working-directory: be
        run: uv run python manage.py migrate --noinput --settings=tests.settings

      - name: Focused maintenance and contract tests
        working-directory: be
        run: |
          uv run pytest             tests/test_runtime_maintenance.py             tests/test_platform_operations.py             tests/test_openapi_contract.py

      - name: Static and migration checks
        working-directory: be
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run python manage.py check --settings=tests.settings
          uv run python manage.py makemigrations --check --dry-run --settings=tests.settings
          uv run python manage.py export_openapi --check --settings=tests.settings

  frontend-reliability:
    runs-on: ubuntu-latest
    env:
      COMPASS_API_BASE_URL: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22.18.0"
          cache: pnpm
          cache-dependency-path: fe/pnpm-lock.yaml

      - name: Install locked dependencies
        working-directory: fe
        run: pnpm install --frozen-lockfile

      - name: Generate API client
        working-directory: fe
        run: pnpm api:generate

      - name: Verify generated public status client
        working-directory: fe
        run: |
          grep -q "usePlatformPublicStatus" src/lib/api/generated/platform-operations/platform-operations.ts
          grep -q "platformPublicStatus" src/lib/api/generated/platform-operations/platform-operations.ts

      - name: Lint
        working-directory: fe
        run: pnpm lint

      - name: Typecheck
        working-directory: fe
        run: pnpm typecheck

      - name: Production build
        working-directory: fe
        run: pnpm build

      - name: Diff whitespace check
        run: git diff --check 68a052ab28ef025017afd50505b620ea3858cb02...HEAD
# exact-head validation after lint and Ruff fixes
