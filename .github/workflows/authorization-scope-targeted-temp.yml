name: Authorization scope targeted validation

on:
  push:
    branches:
      - feature/authorization-resource-scope-hardening

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: compass_test
          POSTGRES_USER: compass
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compass -d compass_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install locked dependencies
        working-directory: be
        run: uv sync --frozen

      - name: Static and migration checks
        working-directory: be
        run: |
          uv lock --check
          uv run ruff format --check .
          uv run ruff check .
          uv run python -m compileall -q compass tests
          uv run python manage.py makemigrations --check --dry-run --settings=tests.settings
          uv run python manage.py migrate --noinput --settings=tests.settings
          uv run python manage.py check --settings=tests.settings
          uv run python manage.py export_openapi --check --settings=tests.settings

      - name: Targeted authorization and privacy tests
        working-directory: be
        run: >-
          uv run pytest -q
          tests/test_organization.py
          tests/test_appointment_management_scope.py
          tests/test_appointments.py::test_explicit_cross_scope_counselor_is_allowed_and_gss_is_not_student_selectable
          tests/test_appointments.py::test_eligible_counselors_are_cross_scope_bounded_and_default_is_marked
          tests/test_referrals.py::test_referral_scope_is_current_organization_scope_without_assigned_counselor_field
          tests/test_call_slips.py::test_counselor_gss_and_head_issuer_and_scope_rules
          tests/test_call_slips.py::test_gss_requires_current_active_counselor_supervisor
          tests/test_counseling.py::test_direct_encounter_records_actual_completed_time_without_fake_appointment
          tests/test_counseling.py::test_head_designation_has_no_blanket_read_and_patch_cannot_change_identity
          tests/test_routine_interviews.py::test_direct_creation_has_no_fake_appointment_and_persistent_idempotency
          tests/test_inventory_counselor_review.py::test_inventory_roster_scope_missing_filters_search_and_draft_privacy
          tests/test_inventory_counselor_review.py::test_cross_scope_counseling_assignment_does_not_expand_inventory_or_support_access
          tests/test_student_support.py::test_head_can_view_any_current_submitted_student_support_context
          tests/test_student_support.py::test_ordinary_counselor_scope_is_current_affiliation_and_responsibility_only
          tests/test_student_support.py::test_counselor_without_responsibility_and_inactive_org_get_no_support_data
          tests/test_student_profiling_reports.py::test_reports_view_is_counselor_baseline_but_does_not_fabricate_scope
          tests/test_student_profiling_reports.py::test_student_profile_enforces_current_counselor_college_scope_across_filters_and_history

      - name: Diff whitespace check
        run: git diff --check
